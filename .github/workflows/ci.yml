name: CI

# Gates mergeability to main. Render auto-deploys on merge (autoDeploy in
# render.yaml) — this workflow does NOT deploy, it only decides if code is sound.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint · Test · Eval
    runs-on: ubuntu-latest
    # Tests run against SQLite/FAISS defaults — no external services or secrets.
    env:
      APP_ENV: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install (app + dev deps)
        run: pip install .[dev]

      - name: Lint (ruff)
        run: ruff check app/ tests/ eval/

      - name: Test (pytest)
        run: pytest -q

      - name: Eval gate (retrieval recall@5 >= 90%)
        run: |
          out="$(python -m eval.run --no-llm)"
          echo "$out"
          recall="$(echo "$out" | sed -n 's/^Recall@5:[[:space:]]*\([0-9]\{1,3\}\)%.*/\1/p')"
          if [ -z "$recall" ]; then
            echo "::error::Could not parse Recall@5 from eval output"; exit 1
          fi
          echo "Parsed Recall@5 = ${recall}%"
          if [ "$recall" -lt 90 ]; then
            echo "::error::Recall@5 ${recall}% is below the 90% gate"; exit 1
          fi

  docker:
    name: Docker build smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t closebrief:ci .
