name: Nightly Eval (LLM)

# Full eval WITH generation metrics to track faithfulness/groundedness drift.
# Non-blocking (does not gate PRs). Needs OPENAI_API_KEY as a repo Actions secret.
on:
  schedule:
    - cron: "0 6 * * *" # 06:00 UTC daily
  workflow_dispatch: {}

jobs:
  eval:
    name: Full eval with LLM
    runs-on: ubuntu-latest
    env:
      APP_ENV: test
      LLM_PROVIDER: openai
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install (app + dev deps)
        run: pip install .[dev]

      - name: Full eval (recall, faithfulness, groundedness, Q&A)
        run: python -m eval.run

      - name: Prompt A/B (baseline vs concise)
        run: python -m eval.ab --out ab_results.json

      - name: Upload A/B results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ab-results
          path: ab_results.json
