[project]
name = "closebrief"
version = "0.1.0"
description = "Narrative BI — RAG-based AI agent for automated FP&A variance commentary"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pandas>=2.2",
    "numpy>=1.26",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "python-multipart>=0.0.12",
    "python-dotenv>=1.0",
    "openai>=1.50",
    "anthropic>=0.40",
    "faiss-cpu>=1.8",
    "openpyxl>=3.1",
    "psycopg[binary]>=3.1",
    "psycopg-pool>=3.2",
    "redis>=5.0",
    "PyJWT[crypto]>=2.8",
    "sentry-sdk[fastapi]>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
    "ruff>=0.5",
]
local = [
    "sentence-transformers>=3.0",
]

[tool.pytest.ini_options]
# "." for the app package; "tests" so shared helpers (dbharness) import cleanly.
pythonpath = [".", "tests"]
markers = [
    # Tests coupled to SQLite's typeless columns (they assert on short string
    # user ids that Postgres's UUID attribution columns reject). The Postgres CI
    # job runs `-m 'not sqlite_only'`; they still run in the default SQLite job.
    "sqlite_only: run only under SQLite, not the Postgres CI job",
]

[tool.ruff]
target-version = "py311"
line-length = 150   # generous: some KPI-library data lines and SQL are long
extend-exclude = [".venv", "graphify-out", "data"]

[tool.ruff.lint]
# Pyflakes (unused imports/vars, undefined names) + a focused pycodestyle set.
select = ["E", "F", "W", "I"]
ignore = ["E402", "E741"]

[tool.setuptools.packages.find]
include = ["app*"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
