# Render Blueprint (Infrastructure as Code). Import via Render dashboard ->
# New -> Blueprint, pointed at your GitHub repo. Secrets (sync:false) are set
# once in the Render dashboard, never committed here.
services:
  - type: web
    name: closebrief
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free               # $0, sleeps after ~15 min idle (cold start ~50s).
                             # Change to `starter` (~$7/mo) to avoid sleeps.
    branch: main
    # Deploy every push to main once its GitHub checks (CI) pass.
    autoDeployTrigger: checksPass
    healthCheckPath: /health
    # Migrations: on startup the app applies any pending app/migrations/pg/*.sql
    # itself (auto_migrate=true in app/config.py), so nothing runs by hand. The
    # free plan has no preDeployCommand; on `starter` you could move it there.
    envVars:
      - key: APP_ENV
        value: prod
      - key: LLM_PROVIDER
        value: openai
      - key: VECTOR_BACKEND
        value: pgvector
      - key: TRUST_PROXY_HEADERS # Render supplies X-Forwarded-For for visitor rate limits
        value: "true"
      - key: AUTH_ENABLED
        value: "true"
      - key: DEMO_MODE           # seeds sample data; anonymous read-only browsing
        value: "true"
      - key: RLS_ENABLED         # DB-level workspace isolation backstop (Postgres RLS);
        value: "true"            # fail-open, so demo (unscoped) still browses freely
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4o
      - key: OPENAI_EMBEDDING_MODEL
        value: text-embedding-3-small
      - key: DATABASE_URL
        sync: false          # Supabase transaction pooler (port 6543)
      - key: REDIS_URL
        sync: false          # Upstash rediss:// URL
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_JWT_SECRET
        sync: false
      - key: SESSION_JWT_SECRET
        sync: false          # separate key for Google user sessions
      - key: SENTRY_DSN
        sync: false
      - key: SCHEDULER_TOKEN   # shared secret; an external cron sends it as
        sync: false            # X-Scheduler-Token to POST /internal/scheduler/tick
